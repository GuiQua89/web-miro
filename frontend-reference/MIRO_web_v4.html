<title>MIRO — Agencia de IA y Marketing Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #FDF6EC;
    color: #111;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  :root {
    --blue: #1A5FD4;
    --navy: #0D2E6E;
    --cream: #FDF6EC;
    --black: #111111;
    --white: #FFFFFF;
    --gray: #555555;
    --blue-subtle: rgba(26,95,212,0.08);
    --blue-light: #4A85E8;
    --whatsapp: #25D366;
    --shadow-card: 0 2px 16px rgba(0,0,0,0.06);
    --shadow-hover: 0 6px 32px rgba(0,0,0,0.10);
    --radius-btn: 6px;
    --radius-card: 12px;
    --container: 1160px;
    --section-py: 110px;
  }

  /* Scroll-triggered fade in */
  .fade-in { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  /* ── Hero grid bg ── */
  .hero-grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(26,95,212,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(26,95,212,0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Typewriter cursor ── */
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  .tw-cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: #1A5FD4;
    margin-left: 4px;
    vertical-align: middle;
    border-radius: 2px;
    animation: blink 1s step-end infinite;
  }

  /* ── AIMA card glow on hover ── */
  .aima-card {
    transition: box-shadow 280ms ease, transform 280ms ease;
  }
  .aima-card:hover {
    box-shadow: 0 0 0 1.5px rgba(26,95,212,0.5), 0 8px 32px rgba(26,95,212,0.18);
    transform: translateY(-3px);
  }

  /* ── Tech carousel ── */
  .carousel-track {
    display: flex;
    gap: 48px;
    align-items: center;
    animation: scroll-left 22s linear infinite;
    width: max-content;
  }
  .carousel-track:hover { animation-play-state: paused; }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .carousel-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0.55;
    transition: opacity 250ms ease;
    flex-shrink: 0;
    cursor: default;
  }
  .carousel-item:hover { opacity: 1; }
  .carousel-item span {
    font-family: 'Outfit';
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #555;
  }

  /* ── Mobile-first responsive ── */
  @media (max-width: 768px) {
    :root {
      --section-py: 72px;
      --container: 100%;
    }

    /* Navbar: hide desktop links, show hamburger */
    .nav-links { display: none !important; }
    .nav-cta   { display: none !important; }
    .nav-hamburger { display: flex !important; }

    /* Mobile menu overlay */
    .mobile-menu {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #FDF6EC;
      z-index: 999;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    /* Grids collapse to single column */
    .grid-3, .grid-4, .grid-2 {
      grid-template-columns: 1fr !important;
    }

    /* Hero padding adjustment */
    .hero-inner {
      padding-block: 60px 80px !important;
    }

    /* CTA buttons stack on mobile */
    .cta-group {
      flex-direction: column !important;
      align-items: stretch !important;
    }
    .cta-group a, .cta-group button {
      justify-content: center !important;
      text-align: center;
    }

    /* Pricing cards stack */
    .plans-grid {
      flex-direction: column !important;
    }
    .plan-card {
      width: 100% !important;
    }

    /* WhatsApp float button smaller on mobile */
    .wa-float {
      bottom: 20px !important;
      right: 20px !important;
      width: 52px !important;
      height: 52px !important;
    }
  }

  /* Hide hamburger on desktop */
  .nav-hamburger { display: none; }
  .mobile-menu   { display: none; }

  /* Smooth anchor scroll offset for fixed nav */
  html { scroll-padding-top: 80px; }

</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Typewriter hook ── */
function useTypewriter(words, speed = 70, pause = 2000) {
  const [display, setDisplay] = useState('');
  const [wordIdx, setWordIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    const word = words[wordIdx];
    let timeout;
    if (!deleting && charIdx < word.length) {
      timeout = setTimeout(() => setCharIdx(c => c + 1), speed);
    } else if (!deleting && charIdx === word.length) {
      timeout = setTimeout(() => setDeleting(true), pause);
    } else if (deleting && charIdx > 0) {
      timeout = setTimeout(() => setCharIdx(c => c - 1), speed / 2);
    } else if (deleting && charIdx === 0) {
      setDeleting(false);
      setWordIdx(i => (i + 1) % words.length);
    }
    return () => clearTimeout(timeout);
  }, [charIdx, deleting, wordIdx]);

  useEffect(() => { setDisplay(words[wordIdx].slice(0, charIdx)); }, [charIdx, wordIdx]);
  return display;
}

function Btn({ variant = 'primary', children, onClick, style = {}, href }) {
  const [hov, setHov] = useState(false);

  const variants = {
    primary: {
      background: hov ? '#0D2E6E' : '#1A5FD4',
      color: '#fff', borderColor: hov ? '#0D2E6E' : '#1A5FD4',
    },
    secondary: {
      background: hov ? 'rgba(26,95,212,0.08)' : 'transparent',
      color: '#1A5FD4', borderColor: '#1A5FD4',
    },
    'secondary-dark': {
      background: hov ? 'rgba(255,255,255,0.12)' : 'transparent',
      color: '#fff', borderColor: 'rgba(255,255,255,0.8)',
    },
    'white-navy': {
      background: hov ? '#f0f4ff' : '#fff',
      color: '#0D2E6E', borderColor: '#fff',
    },
  };

  const props = {
    style: { ...C.btn, ...variants[variant], ...style },
    onMouseEnter: () => setHov(true),
    onMouseLeave: () => setHov(false),
    onClick,
  };

  if (href) return <a href={href} {...props}>{children}</a>;
  return <button {...props}>{children}</button>;
}

/* ─────────────────────────────────────────
   INTERSECTION OBSERVER HOOK
───────────────────────────────────────── */
function useFadeIn() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
    }, { threshold: 0.12 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 50);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const links = [
    { label: 'Sistema', href: '#sistema' },
    { label: 'Método', href: '#metodo' },
    { label: 'Nosotros', href: '#nosotros' },
    { label: 'Contacto', href: '#contacto' },
  ];

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 1000,

/* ─────────────────────────────────────────
   FADE CARD HELPER
───────────────────────────────────────── */
function FadeCard({ children, delay = 0 }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setTimeout(() => { el.classList.add('visible'); }, delay);
        obs.disconnect();
      }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [delay]);
  return <div ref={ref} className="fade-in" style={{ height: '100%' }}>{children}</div>;
}

/* ─────────────────────────────────────────
   TWEAKS
───────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryColor": "#1A5FD4",
  "navyColor": "#0D2E6E",
  "creamBg": "#FDF6EC",
  "heroSize": 88,
  "showFloat": true
}/*EDITMODE-END*/;

function TweaksPanel({ tweaks, setTweaks, visible, onClose }) {
  if (!visible) return null;
  const update = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };

  return (
    <div style={{
      position: 'fixed', bottom: 24, left: 24, zIndex: 9000,
      background: '#fff', borderRadius: 12, boxShadow: '0 8px 40px rgba(0,0,0,0.18)',
      padding: '20px 22px', width: 264, fontFamily: 'Outfit',
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
        <span style={{ fontWeight: 700, fontSize: 14, color: '#111' }}>Tweaks</span>
        <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#999', fontSize: 18, lineHeight: 1 }}>✕</button>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <label style={{ fontSize: 12, color: '#555', display: 'flex', flexDirection: 'column', gap: 6 }}>
          Color principal
          <input type="color" value={tweaks.primaryColor} onChange={e => update('primaryColor', e.target.value)}
            style={{ height: 34, borderRadius: 6, border: '1px solid #e0e0e0', cursor: 'pointer', width: '100%' }} />
        </label>
        <label style={{ fontSize: 12, color: '#555', display: 'flex', flexDirection: 'column', gap: 6 }}>
          Color navy / headings
          <input type="color" value={tweaks.navyColor} onChange={e => update('navyColor', e.target.value)}
            style={{ height: 34, borderRadius: 6, border: '1px solid #e0e0e0', cursor: 'pointer', width: '100%' }} />
        </label>
        <label style={{ fontSize: 12, color: '#555', display: 'flex', flexDirection: 'column', gap: 6 }}>
          Fondo crema
          <input type="color" value={tweaks.creamBg} onChange={e => update('creamBg', e.target.value)}
            style={{ height: 34, borderRadius: 6, border: '1px solid #e0e0e0', cursor: 'pointer', width: '100%' }} />
        </label>
        <label style={{ fontSize: 12, color: '#555', display: 'flex', flexDirection: 'column', gap: 6 }}>
          Tamaño H1 hero: {tweaks.heroSize}px
          <input type="range" min={52} max={100} value={tweaks.heroSize} onChange={e => update('heroSize', Number(e.target.value))}
            style={{ accentColor: tweaks.primaryColor }} />
        </label>
        <label style={{ fontSize: 12, color: '#555', display: 'flex', alignItems: 'center', gap: 8 }}>
          <input type="checkbox" checked={tweaks.showFloat} onChange={e => update('showFloat', e.target.checked)}
            style={{ accentColor: tweaks.primaryColor, width: 14, height: 14 }} />
          Mostrar botón flotante WA
        </label>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────
   APP
───────────────────────────────────────── */
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Apply tweaks as CSS vars
  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--blue', tweaks.primaryColor);
    root.style.setProperty('--navy', tweaks.navyColor);
    root.style.setProperty('--cream', tweaks.creamBg);
  }, [tweaks]);

  return (
    <>
      <Navbar />
      <main>
        <Hero />
        <Diagnostico />
        <SistemaAIMA />
        <Planes />
        <Nosotros />
        <FAQ />
        <Contacto />
      </main>
      <Footer />
      {tweaks.showFloat && <WAFloat />}
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible}
        onClose={() => {
          setTweaksVisible(false);
          window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
        }} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
